[project]
name = "workshop-mcp-server"
version = "0.1.0"
description = "An MCP server that lets a language model query a garage workshop database"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nick Sejan", email = "nicksejan@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "sqlite", "agent-tools"]

# Pinned to the 1.x line on purpose. MCP SDK 2.0 renamed FastMCP to MCPServer
# and moved its import path with no deprecation shim, so this server does not
# run unmodified on 2.x.
dependencies = ["mcp[cli]>=1.2.0,<2.0.0"]

[project.scripts]
workshop-mcp = "workshop.server:main"
workshop-seed = "workshop.seed:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workshop"]

# --------------------------------------------------------------------------
# tooling
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F  pycodestyle + pyflakes   I  import order (replaces isort)
# UP   pyupgrade                B  bugbear      SIM  simplify
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The seed fixtures are a table: one database row per line of source. Holding
# them to the 88-column limit would mean breaking rows across lines, which makes
# the data harder to read, not easier.
"src/workshop/seed.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["workshop"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
